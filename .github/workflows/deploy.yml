name: Deploy Frontend + Sanity Studio to Azure Static Web Apps

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - dev

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v3

      # Set Node version
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # ---------------- FRONTEND ----------------
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # ---------------- SANITY STUDIO ----------------
      - name: Install sanity studio dependencies
        working-directory: ./sanity-studio
        run: npm install

      - name: Build sanity studio
        working-directory: ./sanity-studio
        run: npm run build

      # ---------------- DEPLOYMENT ----------------
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_SMOKE_025A05B00 }}
          action: "upload"

          # Frontend Output
          app_location: "frontend"
          app_build_output_location: "build"

          # Sanity Studio Output
          output_location: "sanity-studio/dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_SMOKE_025A05B00 }}
          action: "close"
