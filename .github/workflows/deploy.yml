name: Deploy Portfolio (Frontend + Sanity)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ------- FRONTEND -------
      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ------- SANITY -------
      - name: Install sanity deps
        working-directory: sanity-studio
        run: npm install

      - name: Build sanity studio
        working-directory: sanity-studio
        run: npm run build

      # ------- DEPLOY -------
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: upload
          # FRONTEND APP
          app_location: "frontend"
          app_build_output_location: "build"
          # SANITY OUTPUT
          output_location: "sanity-studio/dist"
